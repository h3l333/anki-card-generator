services:
  postgres:
    image: postgres:16
    container_name: anki_tool_postgres
    ports:
      - "5432:5432"
    environment:
      # Override via a local .env file (not committed) for anything beyond local dev use.
      - POSTGRES_USER=${POSTGRES_USER:-anki_tool}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-devpassword}
      - POSTGRES_DB=${POSTGRES_DB:-anki_tool}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
